---
name: git_tag_syncro_go_proxy
command: "git add . ; git commit -m \"{{arg_1}}\" ; git push origin {{arg_2}} ; git tag {{arg_3}} ; git push origin {{arg_3}} ; GOPROXY=\"https://proxy.golang.org\" go list -m {{arg_4}}"
description: Permet de mettre un tag sur un push et mettre a jour le proxy de go
arguments:
  - name: arg_1
    arg_type: Text
    description: ~
    default_value: update version tag v0.0.9
  - name: arg_2
    arg_type: Text
    description: ~
    default_value: main
  - name: arg_3
    arg_type: Text
    description: ~
    default_value: v0.0.9
  - name: arg_4
    arg_type: Text
    description: ~
    default_value: github.com/quirky1869/install-packages-26.04@v0.0.9
tags: []
source_url: https://github.com/Quirky1869
author: Quirky
author_url: ~
shells: []
